[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yapshell"
version = "1.1.0"
description = "A funky CLI that talks to Qwen 3.6 via Ollama with animations and attitude"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
yap = "yapshell.launcher:main"
yapshell = "yapshell.launcher:main"
yapshell-setup = "yapshell.installer:main"

[tool.setuptools]
packages = ["yapshell"]
